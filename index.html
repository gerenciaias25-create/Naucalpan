<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel de Dashboards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f8;
    }

    /* Barra de navegación de pestañas */
    .tab-container {
      display: flex;
      background-color: #1e293b;
      padding: 10px 10px 0 10px;
      gap: 5px;
      border-bottom: 2px solid #0f172a;
    }

    .tab-button {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background-color: #334155;
      color: #94a3b8;
      font-weight: 600;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #475569;
      color: #ffffff;
    }

    .tab-button.active {
      background-color: #ffffff;
      color: #0f172a;
    }

    /* Contenedor de los iframes */
    .content-container {
      height: calc(100vh - 48px);
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="tab-container">
    <button class="tab-button active" onclick="openTab('dash1', this)">Dashboard 1</button>
    <button class="tab-button" onclick="openTab('dash2', this)">Dashboard 2</button>
  </div>

  <div class="content-container">
    <iframe id="dash1" class="active" src="dashboard1.html"></iframe>
    <iframe id="dash2" src="dashboard2.html"></iframe>
  </div>

  <script>
    function openTab(tabId, element) {
      // Ocultar todos los iframes
      const iframes = document.querySelectorAll('.content-container iframe');
      iframes.forEach(iframe => iframe.classList.remove('active'));

      // Desactivar todos los botones
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach(button => button.classList.remove('active'));

      // Mostrar el iframe seleccionado y activar su botón
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }
  </script>

</body>
</html>
